name: Reusable Python CI Workflow

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
        description: 'Path to the directory containing the Python code to test'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: ${{ inputs.working-directory }}/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Run pytest
        run: uv run --locked pytest tests/
      - name: Run black check (linting)
        run: uv run --locked black --check .
